name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint and formatting are their OWN job, not steps inside the test job.
  #
  # They need no browser, no network and no secrets, and they finish in
  # seconds. As a separate job they run concurrently with the suite, so a
  # style failure does not wait behind a ten-minute browser run and a test
  # failure is not hidden behind a style failure. Both verdicts arrive on
  # their own.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # `--check`, never `--write`: CI reports, it does not silently rewrite
      # the branch it was asked to verify.
      - name: Prettier
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # The runner's API moved between majors, so both supported lines are
        # exercised rather than assumed compatible.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: there are no dependencies.
      - name: Run suite
        run: node --test --test-reporter=spec
      - name: Coverage
        run: node --test --experimental-test-coverage
